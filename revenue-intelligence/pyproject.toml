[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-intelligence"
version = "0.1.0"
description = "Affiliate revenue intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["api", "events", "identity", "attribution", "workers", "workers.tasks", "database"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
